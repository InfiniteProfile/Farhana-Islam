<!DOCTYPE html>
<html lang="en" data-theme="ruby">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Profile Hub ∞ — Farhana Islam</title>
  <meta name="description" content="An endless, algorithmically generated universe of profiles. Scroll forever, or jump to any profile number.">
  <meta name="theme-color" content="#1a080d">
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="bar" id="bar">
    <div class="bar-main">
      <h1 class="brand">Profile Hub<span class="brand-mark" aria-hidden="true">∞</span></h1>

      <form class="search" id="searchForm" role="search" autocomplete="off">
        <label class="sr" for="q">Profile number</label>
        <input id="q" name="q" type="text" inputmode="numeric" enterkeyhint="go"
               placeholder="Profile no." spellcheck="false" autocapitalize="off">
        <button type="submit" class="btn btn-go">Go</button>
      </form>

      <button type="button" class="btn btn-icon" id="themeBtn" aria-label="Switch theme"><span class="swatch" aria-hidden="true"></span></button>
    </div>

    <div class="bar-sub">
      <span class="sub-label">Viewing</span>
      <span class="current" id="current" aria-label="Current profile number">#1</span>
      <span class="msg" id="msg" role="status" aria-live="polite"></span>
    </div>
  </header>

  <main id="track" role="feed" aria-label="Infinite profile feed"></main>

  <button type="button" class="btn top" id="topBtn" hidden aria-label="Back to profile 1">
    <span aria-hidden="true">↑</span> #1
  </button>

  <noscript><p class="noscript">The infinite profile feed needs JavaScript to run.</p></noscript>
</body>
</html>
